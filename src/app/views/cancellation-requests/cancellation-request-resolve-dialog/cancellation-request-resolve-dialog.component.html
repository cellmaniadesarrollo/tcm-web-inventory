<p-dialog
  [header]="isAccept ? 'Aceptar solicitud de cancelación' : 'Rechazar solicitud de cancelación'"
  [(visible)]="displayDialog"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeModal()"
  styleClass="custom-dialog"
>
  <div class="row">
    <div class="col">
      <div class="cr-summary mb-3">
        <div><strong>Solicitud:</strong> {{ row?.requestId }}</div>
        <div><strong>Orden:</strong> {{ row?.orderId }}</div>
        <div><strong>Producto:</strong> {{ row?.productName }} ({{ row?.sku }})</div>
        <div><strong>Cantidad:</strong> {{ row?.quantity }}</div>
        <div *ngIf="row?.reason"><strong>Motivo del solicitante:</strong> {{ row?.reason }}</div>
      </div>

      <div class="row mt-3">
        <div class="custom-form-group w-100">
          <textarea
            class="custom-form-control"
            rows="3"
            placeholder=" "
            [formControl]="observaciones"
          ></textarea>
          <label class="custom-label">
            {{ isAccept ? 'Observaciones (opcional)' : 'Motivo del rechazo' }}
          </label>
        </div>
        <div *ngIf="observaciones.invalid && observaciones.touched" class="error-message">
          Este campo es obligatorio.
        </div>
      </div>

      <div class="alert alert-danger mt-2" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="row mt-3 justify-content-center">
        <div class="col-5">
          <button
            type="button"
            class="btn btn-block"
            [ngClass]="isAccept ? 'btn-success' : 'btn-danger'"
            [disabled]="submitting"
            (click)="confirm()"
          >
            {{ submitting ? 'Procesando...' : (isAccept ? 'Confirmar aceptación' : 'Confirmar rechazo') }}
          </button>
        </div>
        <div class="col-4">
          <button type="button" class="btn btn-secondary btn-block" [disabled]="submitting" (click)="closeModal()">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</p-dialog>
