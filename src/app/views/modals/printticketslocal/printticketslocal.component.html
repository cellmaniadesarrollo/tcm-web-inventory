<p-dialog
  header="Imprimir Etiquetas Impresora local"
  [(visible)]="displayDialog"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="closeModal( )"
  styleClass="custom-dialog"
>
  <div class="row">
    <div class="col" *ngIf="loading; else dataLoaded">
        <H3><strong>Por Favor Espere</strong> </H3>
    <div class="spinner-border text-primary" role="status">
        
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <ng-template #dataLoaded>
        <div class="col">
            <form [formGroup]="printform"> 
              <div class="row mt-3">
      
                <div class="custom-form-group">
                  <input
                    type="number"
                    class="custom-form-control"
                    [ngClass]="{ 'input-error': printform.get('cant')?.invalid && submitted }"
                    placeholder=" "
                    formControlName="cant"
                    min="1"  
                    (input)="onInputChange($event)"
                    (focus)="onFocus($event)"
                  />
                  <label for="myInpu" class="custom-label">Cantidad etiquetas</label>
                </div>
                <div *ngIf="printform.get('cant')?.invalid && submitted" class="error-message">
                  <div *ngIf="printform.get('cant')?.errors?.['required']">
                    La cantidad es requerida.
                  </div>
                  <div *ngIf="printform.get('cant')?.errors?.['min']">
                    La cantidad debe ser mayor a 0.
                  </div>
                </div>
              </div> 
            </form>
            <div class="row mt-3 justify-content-center">
              <div class="col-3">
                
                <button
                  type="submit"
                  class="btn btn-primary btn-block"
                  (click)="onSubmit()"
                >
                  Aceptar
                </button>
              </div> 
              <div class="col-3">
                <button
                  type="button"
                  class="btn btn-danger btn-block"
                  (click)="closeModal( )"
                >
                  Cancelar
                </button>
              </div>
            </div>
          </div>
    </ng-template>

  </div>
</p-dialog>
